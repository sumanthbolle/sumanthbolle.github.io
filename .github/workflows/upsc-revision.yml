name: UPSC spaced-revision queue

# Rebuilds data/upsc/revision-queue.json once a day after the last official-source
# publish slot (18:15 UTC). 19:30 UTC leaves a buffer so the 45-minute publisher
# job can finish before this run writes the shared data/upsc tree. The job uses
# the same concurrency group as the publisher so the two cannot commit at once.

on:
  schedule:
    - cron: "30 19 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upsc-official-publisher
  cancel-in-progress: false

jobs:
  revision:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out triggering ref
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run publisher tests
        run: python -m unittest discover -s scripts/upsc -p 'test_*.py'

      - name: Build today's revision queue
        run: >-
          python scripts/upsc/revision.py
          --output data/upsc
          --limit 5

      - name: Commit revision queue
        run: |
          git config user.name "upsc-publisher[bot]"
          git config user.email "upsc-publisher[bot]@users.noreply.github.com"
          git add data/upsc/revision-queue.json
          if git diff --cached --quiet; then
            echo "No revision queue changes"
          else
            git commit -m "chore: refresh UPSC spaced-revision queue"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
