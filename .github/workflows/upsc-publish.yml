name: Publish UPSC official-source study archive

on:
  schedule:
    - cron: "15 0,6,12,18 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upsc-data
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out triggering ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Run publisher tests
        run: |
          python -m unittest discover -s scripts/upsc -p 'test_*.py'
          node scripts/test-upsc-api.mjs
          node scripts/test-upsc-content.js
          node scripts/test-upsc-packet.js
          node scripts/test-upsc-render.js
          node scripts/test-upsc-reading.js
          node scripts/test-upsc-memory.js
          node scripts/test-upsc-shell.js
          node scripts/test-upsc-guide.js
          node scripts/test-upsc-scroll.js
          node scripts/test-upsc-coach.js
          node scripts/test-upsc-sources.mjs
          node scripts/test-upsc-pocket.mjs
          node scripts/test-upsc-sitemap.js
          node scripts/test-upsc-workflow.js
          node scripts/test-upsc-edition-progress.js
          node scripts/test-upsc-answer-render.js
          node scripts/test-upsc-edition.js
          node scripts/test-upsc-edition-integration.js

      - name: Snapshot previous source health
        run: |
          if [ -f data/upsc/source-health.json ]; then
            cp data/upsc/source-health.json /tmp/source-health.previous.json
          else
            echo '{}' > /tmp/source-health.previous.json
          fi

      - name: Verify all official source contracts
        id: source-check
        run: |
          set -o pipefail
          python scripts/upsc/publish.py check-sources \
            --registry data/upsc/source-registry.json \
            --min-healthy 5 | tee data/upsc/source-health.json

      - name: Open or close source-health issues
        if: always() && hashFiles('data/upsc/source-health.json') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'upsc-source-health';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'B60205',
                description: 'Official UPSC source feed failed the publisher health probe',
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            fs.writeFileSync(
              '/tmp/open-health-issues.json',
              JSON.stringify(issues.map((issue) => ({
                number: issue.number,
                title: issue.title,
                labels: (issue.labels || []).map((row) => (
                  typeof row === 'string' ? row : row.name
                )),
                pull_request: issue.pull_request || null,
              }))),
            );
            const output = execFileSync('python', [
              'scripts/upsc/alerting.py', 'reconcile',
              '--health', 'data/upsc/source-health.json',
              '--previous', '/tmp/source-health.previous.json',
              '--open-issues', '/tmp/open-health-issues.json',
            ], { encoding: 'utf8' });
            const plan = JSON.parse(output);
            for (const item of plan.create || []) {
              await github.rest.issues.create({
                owner, repo, title: item.title, body: item.body, labels: item.labels,
              });
            }
            for (const item of plan.update || []) {
              await github.rest.issues.update({
                owner, repo, issue_number: item.number, body: item.body,
              });
            }
            for (const item of plan.close || []) {
              if (item.comment) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number, body: item.comment,
                });
              }
              await github.rest.issues.update({
                owner, repo, issue_number: item.number, state: 'closed',
              });
            }

      - name: Ingest official records
        run: >-
          python scripts/upsc/publish.py ingest
          --registry data/upsc/source-registry.json
          --output data/upsc

      - name: Archive newspaper discovery items
        # Busy newspaper feeds keep about two hours of items; editions read
        # this archive for the parts of their window the live feed has dropped.
        continue-on-error: true
        run: python scripts/upsc/discovery.py --archive data/upsc

      - name: Start local UPSC Worker
        id: local-worker
        continue-on-error: true
        uses: ./.github/actions/upsc-local-worker
        with:
          perplexity-api-key: ${{ secrets.PERPLEXITY_API_KEY }}

      - name: Enrich source records
        if: steps.local-worker.outcome == 'success'
        continue-on-error: true
        run: python scripts/upsc/live_publish.py --no-live-feed --report /tmp/upsc-live-result.json

      - name: Open or close verification-hold issues
        if: always() && hashFiles('data/upsc/needs-review.json') != ''
        uses: actions/github-script@v8
        with:
          script: |
            const { execFileSync } = require('child_process');
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const label = 'upsc-needs-review';
            try {
              await github.rest.issues.getLabel({ owner, repo, name: label });
            } catch (error) {
              if (error.status !== 404) throw error;
              await github.rest.issues.createLabel({
                owner, repo, name: label, color: 'FBCA04',
                description: 'UPSC enrichment failed second-pass verification',
              });
            }
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, state: 'open', labels: label, per_page: 100,
            });
            fs.writeFileSync('/tmp/open-review-issues.json', JSON.stringify(issues.map((issue) => ({
              number: issue.number, title: issue.title,
              labels: (issue.labels || []).map((row) => typeof row === 'string' ? row : row.name),
              pull_request: issue.pull_request || null,
            }))));
            const output = execFileSync('python', [
              'scripts/upsc/verify.py', 'reconcile-issues',
              '--queue', 'data/upsc/needs-review.json',
              '--open-issues', '/tmp/open-review-issues.json',
            ], { encoding: 'utf8' });
            const plan = JSON.parse(output);
            for (const item of plan.create || []) {
              await github.rest.issues.create({
                owner, repo, title: item.title, body: item.body, labels: item.labels,
              });
            }
            for (const item of plan.close || []) {
              if (item.comment) {
                await github.rest.issues.createComment({
                  owner, repo, issue_number: item.number, body: item.comment,
                });
              }
              await github.rest.issues.update({
                owner, repo, issue_number: item.number, state: 'closed',
              });
            }

      - name: Generate Mains drills
        continue-on-error: true
        run: |
          extra=()
          if [ -n "$UPSC_ENRICH_ENDPOINT" ] && [ -n "$UPSC_PUBLISH_TOKEN" ]; then
            extra+=(--endpoint "$UPSC_ENRICH_ENDPOINT" --token "$UPSC_PUBLISH_TOKEN")
          fi
          python scripts/upsc/mains_generator.py \
            --patterns data/upsc-patterns.json \
            --output data/upsc \
            "${extra[@]}"

      - name: Build indexes and crawlable pages
        run: |
          python scripts/upsc/publish.py build-indexes --output data/upsc
          python scripts/upsc/publish.py build-pages --output data/upsc --site-root upsc-study --base-url https://sumanthbolle.com
          node scripts/generate-sitemap.js

      - name: Commit generated publication
        run: |
          git config user.name "upsc-publisher[bot]"
          git config user.email "upsc-publisher[bot]@users.noreply.github.com"
          bash scripts/upsc/push-with-retry.sh -m "chore: publish UPSC official-source update" \
            -r "python scripts/upsc/publish.py build-indexes --output data/upsc && python scripts/upsc/publish.py build-pages --output data/upsc --site-root upsc-study --base-url https://sumanthbolle.com && python scripts/upsc/edition.py --rebuild-index && node scripts/generate-sitemap.js" \
            -- data/upsc upsc-study sitemap.xml
