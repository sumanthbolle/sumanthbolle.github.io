name: Publish verified Pocket news

on:
  schedule:
    # Most frequent GitHub schedule; runs can be delayed by GitHub.
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [upsc-source-update]
  workflow_dispatch:

permissions:
  contents: write

# Own queue: this runs every 5 minutes, and in the shared upsc-data group each
# new pending run would cancel a queued edition or archive run. Pushes rebase
# onto main first, so commits do not race.
concurrency:
  group: upsc-live-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # Notes are generated on the runner with PERPLEXITY_API_KEY; readers get
      # the committed data/upsc/pocket-feed.json snapshot.
      - uses: ./.github/actions/upsc-local-worker
        with:
          perplexity-api-key: ${{ secrets.PERPLEXITY_API_KEY }}
      - name: Ingest, verify and release passing notes immediately
        run: python scripts/upsc/live_publish.py --no-live-feed --report /tmp/upsc-live-result.json
      - name: Retain source corrections and the verified fallback
        if: always()
        run: |
          if [ ! -f /tmp/upsc-live-result.json ]; then
            exit 0
          fi
          if ! python -c 'import json; import sys; sys.exit(0 if json.load(open("/tmp/upsc-live-result.json"))["changed"] else 1)'; then
            exit 0
          fi
          python scripts/upsc/publish.py build-indexes --output data/upsc
          python scripts/upsc/publish.py build-pages --output data/upsc --site-root upsc-study --base-url https://sumanthbolle.com
          node scripts/generate-sitemap.js
          git config user.name "upsc-publisher[bot]"
          git config user.email "upsc-publisher[bot]@users.noreply.github.com"
          bash scripts/upsc/push-with-retry.sh -m "chore: publish verified Pocket news" \
            -r "python scripts/upsc/publish.py build-indexes --output data/upsc && python scripts/upsc/publish.py build-pages --output data/upsc --site-root upsc-study --base-url https://sumanthbolle.com && python scripts/upsc/edition.py --rebuild-index && node scripts/generate-sitemap.js" \
            -- data/upsc upsc-study sitemap.xml
