name: UPSC Prelims quiz refresh

# Runs after the last official-source publish slot and the 19:30 revision job.
# 20:00 UTC avoids overlap with upsc-daily (01:30) and upsc-publish
# (00:15/06:15/12:15/18:15). Shares the publisher concurrency group so commits
# to data/upsc/ cannot race.

on:
  schedule:
    - cron: "0 20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upsc-data
  cancel-in-progress: false

jobs:
  prelims:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out triggering ref
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run publisher tests
        run: python -m unittest discover -s scripts/upsc -p 'test_*.py'

      - name: Generate Prelims quiz
        run: >-
          python scripts/upsc/prelims_quiz.py
          --patterns data/upsc-patterns.json
          --editions data/upsc/editions
          --output data/upsc

      - name: Commit Prelims quiz
        run: |
          git config user.name "upsc-publisher[bot]"
          git config user.email "upsc-publisher[bot]@users.noreply.github.com"
          bash scripts/upsc/push-with-retry.sh -m "chore: refresh UPSC Prelims quiz" \
            -r "python scripts/upsc/prelims_quiz.py --patterns data/upsc-patterns.json --editions data/upsc/editions --output data/upsc" \
            -- data/upsc/prelims-quiz.json
