name: UPSC tests

# Scheduled UPSC workflows run these suites before publishing, so a change
# that breaks one would otherwise surface only on the next schedule. Run them
# on every pull request and push to main instead.
on:
  pull_request:
    paths: ['api/**', 'assets/**', 'scripts/**', 'data/upsc-patterns.json', '.github/**', 'upsc*.html', 'flights.html', 'metals.html', 'save-yourself.html', 'blog.html']
  push:
    branches: [main]
    paths: ['api/**', 'assets/**', 'scripts/**', 'data/upsc-patterns.json', '.github/**', 'upsc*.html', 'flights.html', 'metals.html', 'save-yourself.html', 'blog.html']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Python publisher tests
        run: python -m unittest discover -s scripts/upsc -p 'test_*.py'
      - name: Node UPSC tests (every scripts/test-upsc-*)
        run: |
          failed=0
          for test in scripts/test-upsc-*.js scripts/test-upsc-*.mjs; do
            echo "::group::$test"
            node "$test" || { echo "::error file=$test::$test failed"; failed=1; }
            echo "::endgroup::"
          done
          exit $failed
      - name: Tool page tests (SkyFare, Metals, Save Yourself)
        run: |
          node scripts/test-utility-pages.js
          node scripts/test-save-yourself.js
          node scripts/test-skyfare-worker.mjs
      - name: Blog daily discoveries generator
        run: node scripts/test-blog-discoveries.js
