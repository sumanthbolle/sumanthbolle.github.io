name: UPSC trigger refresh

# Refreshes the current trigger layer for one anchor per day, so the Pattern
# Atlas holds both halves of a question: the standing anchor and what is live on
# it. 01:30 UTC is 07:00 IST.
#
# A run that produces nothing is normal. The generator exits 2 when its
# validation gate rejects the payload — too few items, a single source host, a
# citation marker, or the model reporting low confidence in its own sourcing —
# and this workflow treats that as a skip rather than a failure. Publishing
# nothing is always better than publishing a wrong committee name to someone
# revising for Mains.

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:
    inputs:
      anchor:
        description: 'Anchor id to refresh (blank = the weighted rotation picks one)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: upsc-daily
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 22 or newer: the generator requires the Worker's ESM verification
      # gate rather than keeping a second copy of the allowlist.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate the pattern compilation
        run: node scripts/validate-upsc-patterns.js

      - name: Check the generated anchor index is in sync
        run: |
          node scripts/generate-upsc-anchor-weights.js
          if ! git diff --quiet api/upsc-anchors.js; then
            echo "::error::api/upsc-anchors.js is stale. Run scripts/generate-upsc-anchor-weights.js and commit the result."
            git --no-pager diff --stat api/upsc-anchors.js
            exit 1
          fi

      - name: Refresh one anchor's trigger layer
        id: refresh
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          set +e
          if [ -n "${{ github.event.inputs.anchor }}" ]; then
            node scripts/fetch-upsc-triggers.js --anchor "${{ github.event.inputs.anchor }}"
          else
            node scripts/fetch-upsc-triggers.js
          fi
          code=$?
          set -e
          if [ "$code" -eq 0 ]; then
            echo "refreshed=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 2 ]; then
            echo "refreshed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Nothing cleared the validation gate on this run. Nothing was written."
          else
            exit "$code"
          fi

      - name: Commit the refreshed trigger layer
        if: steps.refresh.outputs.refreshed == 'true'
        run: |
          if git diff --quiet data/upsc-triggers.json; then
            echo "::notice::The refresh produced no change to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/upsc-triggers.json
          git commit -m "Refresh the UPSC trigger layer for one anchor"
          git push
