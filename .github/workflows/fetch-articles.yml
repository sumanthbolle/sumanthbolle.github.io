# .github/workflows/fetch-articles.yml
name: Fetch Articles & Validate
on:
  schedule:
    # Runs daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Fetch new articles
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/fetch-articles.js
      
      - name: Sanitize content (remove invalid characters)
        run: node scripts/sanitize-content.js
      
      - name: Validate content
        id: validate
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: node scripts/validate-content.js
      
      - name: Show validation report
        if: always()
        run: |
          echo ""
          echo "📋 VALIDATION REPORT"
          echo "===================="
          if [ -f validation-report.json ]; then
            echo "Posts with issues: $(jq '.posts.problems | length' validation-report.json)"
            echo "Interviews with issues: $(jq '.interviews.problems | length' validation-report.json)"
            echo "Critical issues: $(jq '.summary.critical' validation-report.json)"
            echo "Warnings: $(jq '.summary.warnings' validation-report.json)"
            echo ""
            if [ "$(jq '.summary.critical' validation-report.json)" -gt 0 ]; then
              echo "❌ CRITICAL ISSUES:"
              jq -r '.posts.problems[] | select(.issues[] | .severity == "CRITICAL") | "  Post ID \(.id): \(.title)"' validation-report.json 2>/dev/null || true
              jq -r '.interviews.problems[] | select(.issues[] | .severity == "CRITICAL") | "  Interview ID \(.id)"' validation-report.json 2>/dev/null || true
            fi
          else
            echo "⚠️ validation-report.json not found"
          fi
      
      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-report
          path: validation-report.json
          if-no-files-found: ignore
      
      - name: Generate sitemap
        run: node scripts/generate-sitemap.js
      
      - name: Commit changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts.json interviews.json sitemap.xml
          git diff --staged --quiet || git commit -m "📝 Auto-update: Fetch articles, validate & update sitemap"
      
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.ref }}
