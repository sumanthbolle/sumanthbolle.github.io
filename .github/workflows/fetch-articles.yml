# .github/workflows/fetch-articles.yml
# This workflow fetches latest tech articles and interview questions daily

name: Fetch Daily Tech Articles

on:
  schedule:
    # Runs every day at 8:00 AM UTC (adjust to your timezone)
    - cron: '0 8 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

# IMPORTANT: Grant write permissions to push changes
permissions:
  contents: write

jobs:
  fetch-articles:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch articles from Perplexity API
        env:
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
        run: |
          node scripts/fetch-articles.js

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add posts.json interviews.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Daily content $(date +'%Y-%m-%d')" && git push)
