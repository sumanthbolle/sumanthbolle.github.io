<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summaverick — a research-grade AI assistant</title>
  <meta name="description" content="Summaverick is a general-purpose AI research assistant. Ask anything — world news, tech, code, careers, or everyday decisions — and get clear, source-grounded answers.">
  <link rel="canonical" href="https://sumanthbolle.com/summaverick">
  <meta property="og:title" content="Summaverick — AI Research Assistant">
  <meta property="og:description" content="Ask anything — world news, tech, code, or personal decisions — and get clear, source-grounded answers.">
  <meta property="og:image" content="https://sumanthbolle.com/profile.jpeg">
  <meta property="og:url" content="https://sumanthbolle.com/summaverick">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    :root{
      --bg:#050508;
      --surface:rgba(255,255,255,0.04);
      --surface-hover:rgba(255,255,255,0.07);
      --border:rgba(255,255,255,0.08);
      --border-strong:rgba(255,255,255,0.14);
      --text-1:#f5f5f7;
      --text-2:rgba(255,255,255,0.82);
      --text-3:rgba(255,255,255,0.52);
      --text-4:rgba(255,255,255,0.30);
      --accent:#a78bfa;
      --accent-soft:linear-gradient(180deg,#cdb4ff 0%,#a78bfa 100%);
      --glass:rgba(230,233,242,0.06);
      --glass-strong:rgba(225,228,240,0.10);
      --radius:24px;
      --ease:cubic-bezier(.22,1,.36,1);
      --input-area-h:120px; /* updated at runtime; conservative default */
    }
    html{scroll-behavior:smooth}
    body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','SF Pro Text',system-ui,sans-serif;background:var(--bg);color:var(--text-1);-webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column}

    /* Ambient BG */
    .ambient{position:fixed;inset:0;pointer-events:none;z-index:0}
    .ambient .orb{position:absolute;border-radius:50%;filter:blur(120px)}
    .ambient .orb-1{width:34rem;height:34rem;left:50%;top:-14rem;transform:translateX(-50%);background:rgba(96,165,250,0.10)}
    .ambient .orb-2{width:28rem;height:28rem;right:-8rem;top:18%;background:rgba(167,139,250,0.08)}
    .ambient .orb-3{width:26rem;height:26rem;left:-10rem;bottom:12%;background:rgba(103,223,188,0.06)}
    .ambient .grid-overlay{position:absolute;inset:0;opacity:0.03;background-image:linear-gradient(rgba(255,255,255,0.8) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.8) 1px,transparent 1px);background-size:90px 90px}

    /* Nav */
    .sm-nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);background:rgba(5,5,8,0.72);border-bottom:1px solid var(--border)}
    .sm-nav-inner{max-width:1180px;margin:0 auto;padding:0 20px;height:56px;display:flex;align-items:center;justify-content:space-between;gap:16px}
    .sm-brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--text-1)}
    .sm-brand-icon{width:36px;height:36px;border-radius:12px;border:1px solid var(--border-strong);background:var(--surface);display:grid;place-items:center;position:relative;overflow:hidden}
    .sm-brand-icon::before{content:'';position:absolute;inset:0;border-radius:12px;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,0.18),transparent 45%)}
    .sm-brand-icon svg{width:18px;height:18px;stroke:var(--text-2);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;position:relative}
    .sm-brand-name{font-size:15px;font-weight:600;letter-spacing:-0.01em;color:var(--text-1)}
    .sm-nav-links{display:flex;align-items:center;gap:20px}
    .sm-nav-links a{color:var(--text-3);text-decoration:none;font-size:13px;transition:color 0.3s}
    .sm-nav-links a:hover,.sm-nav-links a.active{color:var(--text-1)}
    .sm-new-btn{padding:7px 18px;border-radius:980px;border:1px solid var(--border);background:var(--surface);color:var(--text-2);font-size:13px;cursor:pointer;font-family:inherit;transition:all 0.3s;display:flex;align-items:center;gap:6px}
    .sm-new-btn:hover{background:var(--surface-hover);border-color:var(--border-strong)}
    .sm-new-btn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2}

    /* Main layout */
    .sm-main{flex:1;display:flex;flex-direction:column;position:relative;z-index:1;max-width:860px;width:100%;margin:0 auto;padding:0 20px}

    /* Landing (empty state) */
    .sm-landing{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:9vh 0 calc(var(--input-area-h) + 40px);animation:fadeUp 0.7s var(--ease)}
    .sm-landing.hidden{display:none}
    .sm-landing h1{font-size:clamp(40px,6.4vw,64px);font-weight:600;letter-spacing:-0.045em;line-height:1.04;max-width:680px;color:var(--text-1)}
    .sm-landing h1 .quiet{color:var(--text-3);font-weight:500}
    .sm-landing h1 .accent{background:var(--accent-soft);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
    .sm-landing .subtitle{font-size:16px;color:var(--text-3);margin-top:14px;line-height:1.55;max-width:440px;letter-spacing:-0.005em}
    /* Chat area */
    .sm-chat{flex:1;display:none;flex-direction:column;padding-top:24px;padding-bottom:calc(var(--input-area-h) + 24px);overflow-y:auto}
    .sm-chat.active{display:flex}
    .sm-chat::-webkit-scrollbar{width:5px}
    .sm-chat::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:3px}

    /* Conversation turns — no avatar+name label per turn; the visual
     * difference between a soft right-aligned user message and the
     * full-width AI response is enough signal. */
    .sm-msg{margin-bottom:28px;animation:fadeUp 0.45s var(--ease)}
    .sm-msg-user{display:flex;justify-content:flex-end}
    .sm-msg-user .sm-msg-content{max-width:78%;font-size:15px;line-height:1.55;color:var(--text-1);background:rgba(255,255,255,0.06);border:1px solid var(--border);border-radius:18px 18px 6px 18px;padding:10px 14px;letter-spacing:-0.005em;white-space:pre-wrap}
    .sm-msg-ai .sm-msg-body{max-width:680px}

    .sm-msg-ai .sm-msg-content{font-size:15px;line-height:1.7;color:var(--text-2)}
    .sm-msg-ai .sm-msg-content p,.sm-msg-ai .sm-msg-content ul,.sm-msg-ai .sm-msg-content ol,.sm-msg-ai .sm-msg-content pre,.sm-msg-ai .sm-msg-content h2,.sm-msg-ai .sm-msg-content h3{margin-bottom:14px;opacity:0;transform:translateY(4px);animation:smReveal 0.5s var(--ease) forwards}
    .sm-msg-ai .sm-msg-content > :last-child{margin-bottom:0}
    /* Stagger: each block appears slightly after the previous one. */
    .sm-msg-ai .sm-msg-content > :nth-child(1){animation-delay:0s}
    .sm-msg-ai .sm-msg-content > :nth-child(2){animation-delay:0.08s}
    .sm-msg-ai .sm-msg-content > :nth-child(3){animation-delay:0.16s}
    .sm-msg-ai .sm-msg-content > :nth-child(4){animation-delay:0.24s}
    .sm-msg-ai .sm-msg-content > :nth-child(5){animation-delay:0.32s}
    .sm-msg-ai .sm-msg-content > :nth-child(6){animation-delay:0.40s}
    .sm-msg-ai .sm-msg-content > :nth-child(7){animation-delay:0.48s}
    .sm-msg-ai .sm-msg-content > :nth-child(n+8){animation-delay:0.56s}
    @media(prefers-reduced-motion:reduce){
      .sm-msg-ai .sm-msg-content p,.sm-msg-ai .sm-msg-content ul,.sm-msg-ai .sm-msg-content ol,.sm-msg-ai .sm-msg-content pre,.sm-msg-ai .sm-msg-content h2,.sm-msg-ai .sm-msg-content h3{animation:none;opacity:1;transform:none}
      .sm-widget{animation:none;opacity:1;transform:none}
      .sm-widget-skeleton{animation:none}
      .sm-thinking-mark{animation:none}
    }
    .sm-msg-ai .sm-msg-content strong{color:var(--text-1);font-weight:600}
    .sm-msg-ai .sm-msg-content code{font-size:13px;background:rgba(255,255,255,0.06);padding:2px 6px;border-radius:5px;font-family:ui-monospace,'SF Mono',monospace}
    .sm-msg-ai .sm-msg-content pre{background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;padding:14px 16px;overflow-x:auto;margin:12px 0;font-size:13px;line-height:1.6;font-family:ui-monospace,'SF Mono',monospace}
    .sm-msg-ai .sm-msg-content h2,.sm-msg-ai .sm-msg-content h3{font-size:14px;font-weight:700;color:var(--text-1);margin:18px 0 8px;letter-spacing:-0.01em}
    .sm-msg-ai .sm-msg-content ul,.sm-msg-ai .sm-msg-content ol{margin:8px 0 12px 18px}
    .sm-msg-ai .sm-msg-content li{margin-bottom:6px;line-height:1.6}
    .sm-msg-ai .sm-msg-content a{color:#78a8ff;text-decoration:none}
    .sm-msg-ai .sm-msg-content a:hover{text-decoration:underline}

    /* Citation markers — small, raised, monospaced; not candy. */
    .sm-cite{display:inline-block;min-width:14px;height:14px;padding:0 4px;margin:0 1px;font-family:ui-monospace,'SF Mono',monospace;font-size:10px;font-weight:600;line-height:14px;text-align:center;color:var(--text-3);background:rgba(255,255,255,0.06);border-radius:4px;vertical-align:1px;text-decoration:none;transition:background 0.2s,color 0.2s}
    .sm-cite:hover{background:rgba(255,255,255,0.12);color:var(--text-1)}

    /* Sources panel */
    .sm-sources{margin-top:16px}
    .sm-sources-label{font-size:12px;font-weight:500;color:var(--text-4);margin-bottom:10px;letter-spacing:-0.005em}
    .sm-source-card{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--border);background:transparent;text-decoration:none;color:inherit;transition:background 0.2s,border-color 0.2s;margin-bottom:6px}
    .sm-source-card:hover{background:rgba(255,255,255,0.03);border-color:var(--border-strong)}
    .sm-source-num{width:18px;height:18px;border-radius:5px;background:rgba(255,255,255,0.06);color:var(--text-3);font-family:ui-monospace,'SF Mono',monospace;font-size:10px;font-weight:600;display:grid;place-items:center;flex-shrink:0}
    .sm-source-info{flex:1;min-width:0}
    .sm-source-title{font-size:13px;font-weight:500;color:var(--text-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-0.005em}
    .sm-source-domain{font-size:11px;color:var(--text-4);margin-top:2px}
    .sm-source-arrow{color:var(--text-4);flex-shrink:0;opacity:0.6}
    .sm-source-arrow svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:2}

    /* Related questions */
    .sm-related{margin-top:14px;display:flex;flex-wrap:wrap;gap:8px}
    .sm-related-btn{padding:8px 14px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--text-3);font-size:13px;cursor:pointer;font-family:inherit;text-align:left;letter-spacing:-0.005em;transition:background 0.2s,color 0.2s,border-color 0.2s}
    .sm-related-btn:hover{background:rgba(255,255,255,0.03);color:var(--text-1);border-color:var(--border-strong)}

    /* Thinking indicator — a single soft mark that breathes */
    .sm-thinking{margin-bottom:20px;display:flex;align-items:center;gap:8px;animation:fadeUp 0.3s var(--ease)}
    .sm-thinking-mark{width:14px;height:14px;border-radius:50%;background:var(--text-2);animation:smThink 1.6s ease-in-out infinite}
    @keyframes smThink{0%,100%{transform:scale(0.55);opacity:0.35}50%{transform:scale(1);opacity:0.95}}

    /* Input bar */
    .sm-input-wrap{position:fixed;bottom:0;left:0;right:0;z-index:50;padding:16px 20px 24px;background:linear-gradient(to top,var(--bg) 60%,transparent)}
    .sm-input-bar{max-width:860px;margin:0 auto;border-radius:var(--radius);border:1px solid var(--border-strong);background:rgba(10,10,16,0.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);padding:14px 16px;display:flex;align-items:flex-end;gap:10px;transition:border-color 0.3s}
    .sm-input-bar:focus-within{border-color:rgba(120,168,255,0.35)}
    .sm-input-bar textarea{flex:1;background:none;border:none;outline:none;color:var(--text-1);font-size:15px;font-family:inherit;line-height:1.5;resize:none;max-height:140px;min-height:22px}
    .sm-input-bar textarea::placeholder{color:var(--text-4)}
    .sm-send-btn{width:36px;height:36px;border-radius:50%;border:none;background:#fff;color:#000;cursor:pointer;display:grid;place-items:center;flex-shrink:0;transition:all 0.2s;opacity:0.3;pointer-events:none}
    .sm-send-btn.active{opacity:1;pointer-events:auto}
    .sm-send-btn:hover{transform:scale(1.05)}
    .sm-send-btn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2.5}
    .sm-input-meta{display:flex;align-items:center;gap:8px;margin-top:8px;max-width:860px;margin-left:auto;margin-right:auto;justify-content:center;transition:opacity 0.4s var(--ease)}
    .sm-input-meta.faded{opacity:0;pointer-events:none}
    .sm-input-meta span{font-size:11px;color:var(--text-4);letter-spacing:-0.005em}
    .sm-input-meta a{color:inherit;text-decoration:none;border-bottom:1px solid rgba(255,255,255,0.18);transition:color 0.2s,border-color 0.2s}
    .sm-input-meta a:hover{color:var(--text-2);border-color:var(--text-3)}

    /* Suggestion list — quiet, tap-target sized, no decorative chrome */
    .sm-research-grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:32px;width:100%;max-width:680px;background:var(--border);border:1px solid var(--border);border-radius:14px;overflow:hidden}
    .sm-research-card{background:var(--bg);padding:18px 20px;text-align:left;cursor:pointer;transition:background 0.25s var(--ease)}
    .sm-research-card:hover,.sm-research-card:focus-visible{background:rgba(255,255,255,0.025);outline:none}
    .sm-research-card h3{font-size:14px;font-weight:500;color:var(--text-2);line-height:1.45;letter-spacing:-0.005em;margin:0}
    .sm-research-card p{display:none}
    @media(max-width:640px){.sm-research-grid{grid-template-columns:1fr}}

    /* Trending strip — landing only */
    .sm-trending{width:100%;max-width:880px;margin-top:48px;text-align:left}
    .sm-trending-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 2px 14px;color:var(--text-3);font-size:13px;letter-spacing:-0.005em}
    .sm-trending-label{font-weight:500;color:var(--text-2)}
    .sm-trending-region{color:var(--text-4);font-weight:400}
    /* Always 2-up at tablet+; collapses to 1-up on phones via the
     * media query below. With three cards (GLOBAL fallback), the
     * solo third card spans the full row so the layout reads as a
     * deliberate 2+1, not as an orphaned half-width tile. */
    .sm-trending-grid,.sm-trending-grid.cols-4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
    .sm-trending-grid.cols-3 > .sm-widget:nth-child(3){grid-column:1 / -1}
    .sm-widget{position:relative;border-radius:16px;border:1px solid var(--border);background:rgba(255,255,255,0.025);padding:18px 18px 16px;display:flex;flex-direction:column;text-align:left;text-decoration:none;color:inherit;cursor:pointer;overflow:hidden;transition:background 0.35s var(--ease),border-color 0.35s var(--ease);opacity:0;transform:translateY(6px);animation:smReveal 0.55s var(--ease) forwards}
    .sm-widget:nth-child(1){animation-delay:0.04s}
    .sm-widget:nth-child(2){animation-delay:0.10s}
    .sm-widget:nth-child(3){animation-delay:0.16s}
    .sm-widget:nth-child(4){animation-delay:0.22s}
    .sm-widget:hover,.sm-widget:focus-visible{background:rgba(255,255,255,0.045);border-color:var(--border-strong);outline:none}
    @keyframes smReveal{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .sm-widget-kicker{font-size:12px;color:var(--text-4);margin-bottom:8px;letter-spacing:-0.005em;font-weight:400}
    .sm-widget-title{font-size:15px;font-weight:600;color:var(--text-1);line-height:1.35;margin-bottom:8px;letter-spacing:-0.012em;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
    .sm-widget-body{font-size:13px;color:var(--text-3);line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-bottom:auto}
    .sm-widget-meta{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:12px;color:var(--text-4);letter-spacing:-0.005em}
    .sm-widget-meta .sep{opacity:0.5}
    .sm-widget-src{display:inline-flex;align-items:center;gap:4px;color:var(--text-3);text-decoration:none;transition:color 0.2s}
    .sm-widget-src:hover{color:var(--text-1)}
    .sm-widget-src svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2;opacity:0.7}
    .sm-ticker{display:inline-flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600;letter-spacing:-0.012em}
    .sm-ticker-symbol{color:var(--text-1)}
    .sm-ticker-pct{font-size:13px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-0.005em}
    .sm-ticker-pct.up{color:#34d399}
    .sm-ticker-pct.down{color:#f87171}
    .sm-widget-skeleton{background:rgba(255,255,255,0.06);border-radius:5px;height:10px;animation:smBreathe 2.2s ease-in-out infinite}
    .sm-widget-skeleton.t{height:14px;margin-bottom:8px;width:90%}
    .sm-widget-skeleton.t2{width:72%}
    .sm-widget-skeleton.b{height:10px;margin-bottom:6px}
    .sm-widget-skeleton.b2{width:80%}
    @keyframes smBreathe{0%,100%{opacity:0.45}50%{opacity:0.85}}
    .sm-trending.hidden{display:none}
    @media(max-width:740px){
      .sm-trending-grid,.sm-trending-grid.cols-4,.sm-trending-grid.cols-3{grid-template-columns:1fr}
      .sm-trending-grid.cols-3 > .sm-widget:nth-child(3){grid-column:auto}
    }

    /* Shared motion */
    @keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}

    /* Responsive */
    @media(max-width:640px){
      .sm-nav-links{display:none}
      .sm-landing h1{font-size:34px;line-height:1.06}
      .sm-research-grid{grid-template-columns:1fr}
      .sm-new-btn-label{display:none}
      .sm-new-btn{padding:7px;width:32px;height:32px;justify-content:center}
    }
  </style>
</head>
<body>
  <div class="ambient">
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <nav class="sm-nav">
    <div class="sm-nav-inner">
      <a href="index.html" class="sm-brand">
        <div class="sm-brand-icon">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
        </div>
        <div class="sm-brand-name">Summaverick</div>
      </a>
      <div class="sm-nav-links">
        <a href="index.html">Portfolio</a>
        <a href="blog.html">Blog</a>
        <a href="interviews.html">Interviews</a>
      </div>
      <button class="sm-new-btn" id="newChatBtn" title="New conversation" aria-label="New conversation">
        <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        <span class="sm-new-btn-label">New</span>
      </button>
    </div>
  </nav>

  <main class="sm-main">
    <div class="sm-landing" id="landing">
      <h1>What would you like to <span class="accent">understand</span> today?</h1>
      <p class="subtitle">News, code, decisions — anything you'd reach for a search bar or a friend for. Answers arrive with the sources they came from.</p>

      <section class="sm-trending" id="trendingSection" aria-label="Today" hidden>
        <div class="sm-trending-head">
          <span class="sm-trending-label" id="trendingLabel">Today</span>
          <span class="sm-trending-region" id="trendingRegion"></span>
        </div>
        <div class="sm-trending-grid" id="trendingGrid"></div>
      </section>

      <div class="sm-research-grid" id="researchGrid"></div>
    </div>

    <div class="sm-chat" id="chatArea"></div>
  </main>

  <div class="sm-input-wrap">
    <div class="sm-input-bar" id="inputBar">
      <textarea id="queryInput" rows="1" placeholder="Message Summaverick" autocomplete="off" spellcheck="false"></textarea>
      <button class="sm-send-btn" id="sendBtn" title="Send">
        <svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>
      </button>
    </div>
    <div class="sm-input-meta" id="inputMeta">
      <span>Built by <a href="https://www.linkedin.com/in/sumanthbolle/" target="_blank" rel="noopener">Sumanth Bolle</a></span>
    </div>
  </div>

  <script>
  window.SB_AI_SEARCH_ENDPOINT = 'https://wandering-haze-b394.sumanthbolle312.workers.dev';

  (function(){
    'use strict';

    const ENDPOINT = window.SB_AI_SEARCH_ENDPOINT;
    const MAX_CONTEXT_MESSAGES = 10;

    /* Intentionally short. The hero already greets; a long welcome
     * read like onboarding copy. This sentence is just enough to
     * acknowledge the question is being thought through. */
    const WELCOME_MESSAGE = "Looking that up now.";

    const starters = [
      { query: 'What just happened in the world today?' },
      { query: 'Explain the most important AI release this month, simply.' },
      { query: 'Write a small Python script to summarise a CSV from a URL.' },
      { query: 'Help me think through whether to switch jobs this year.' },
    ];

    const icons = {
      search: '<svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>',
      sparkles: '<svg viewBox="0 0 24 24"><path d="M12 3l1.5 5.5L19 10l-5.5 1.5L12 17l-1.5-5.5L5 10l5.5-1.5L12 3z"/></svg>',
      telescope: '<svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/><path d="M12 8v4l3 3"/></svg>',
      workflow: '<svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
      compass: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
      arrowUp: '<svg viewBox="0 0 24 24"><line x1="12" y1="19" x2="12" y2="5"/><polyline points="5 12 12 5 19 12"/></svg>',
      externalLink: '<svg viewBox="0 0 24 24"><path d="M7 17L17 7M17 7H7M17 7V17"/></svg>',
      newspaper: '<svg viewBox="0 0 24 24"><path d="M4 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>',
      chart: '<svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/><polyline points="14 7 21 7 21 14"/></svg>',
      chip: '<svg viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="2"/><path d="M9 1v4M15 1v4M9 19v4M15 19v4M1 9h4M1 15h4M19 9h4M19 15h4"/></svg>',
      globe: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
    };

    let conversationHistory = [];
    let isLoading = false;

    const landing = document.getElementById('landing');
    const chatArea = document.getElementById('chatArea');
    const queryInput = document.getElementById('queryInput');
    const sendBtn = document.getElementById('sendBtn');
    const newChatBtn = document.getElementById('newChatBtn');
    const researchGridEl = document.getElementById('researchGrid');
    const trendingSection = document.getElementById('trendingSection');
    const trendingGrid = document.getElementById('trendingGrid');
    const trendingRegion = document.getElementById('trendingRegion');
    const inputMeta = document.getElementById('inputMeta');

    function init() {
      renderStarters();
      bindEvents();
      autoResizeTextarea();
      observeInputHeight();
      loadTrending();
    }

    /* Keep a CSS custom property in sync with the actual input area
     * height so the landing and chat reserve enough bottom space and
     * never get hidden behind the fixed input bar — especially on
     * mobile where viewport, keyboard, and a multi-line textarea all
     * change the height dynamically. */
    function observeInputHeight() {
      const wrap = document.querySelector('.sm-input-wrap');
      if (!wrap) return;
      const apply = () => {
        const h = Math.ceil(wrap.getBoundingClientRect().height);
        document.documentElement.style.setProperty('--input-area-h', h + 'px');
      };
      apply();
      if (typeof ResizeObserver === 'function') {
        new ResizeObserver(apply).observe(wrap);
      } else {
        window.addEventListener('resize', apply);
      }
    }

    /* ───────── Trending widgets ───────── */

    function trendingUrl() {
      if (!ENDPOINT) return null;
      try {
        const u = new URL(ENDPOINT);
        u.pathname = '/trending';
        u.search = '';
        return u.toString();
      } catch (e) { return null; }
    }

    function showTrendingSkeleton() {
      if (!trendingSection || !trendingGrid) return;
      trendingSection.hidden = false;
      /* We don't know yet if local-news will be returned (GLOBAL fallback
       * skips it), but rendering 4 skeletons is safe — the real render
       * below reflows the grid once the response arrives. */
      const kinds = ['world','news','market','tech'];
      setGridColumns(kinds.length);
      trendingGrid.innerHTML = kinds.map(() => `
        <div class="sm-widget" aria-busy="true">
          <div class="sm-widget-skeleton t"></div>
          <div class="sm-widget-skeleton t t2"></div>
          <div class="sm-widget-skeleton b"></div>
          <div class="sm-widget-skeleton b b2"></div>
        </div>`).join('');
    }

    function setGridColumns(n) {
      if (!trendingGrid) return;
      trendingGrid.classList.toggle('cols-4', n === 4);
      trendingGrid.classList.toggle('cols-3', n === 3);
    }

    async function loadTrending() {
      const url = trendingUrl();
      if (!url) { hideTrending(); return; }
      showTrendingSkeleton();

      try {
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 12000);
        const res = await fetch(url, { signal: ctrl.signal });
        clearTimeout(timer);
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || !data.success || !data.widgets) throw new Error('no widgets');
        renderTrending(data);
      } catch (e) {
        hideTrending();
      }
    }

    function hideTrending() {
      if (trendingSection) trendingSection.hidden = true;
    }

    function renderTrending(data) {
      const w = data.widgets || {};
      const cards = [];
      if (w.worldNews) cards.push(renderWorldNewsWidget(w.worldNews));
      if (w.news)      cards.push(renderNewsWidget(w.news));
      if (w.market)    cards.push(renderMarketWidget(w.market));
      if (w.tech)      cards.push(renderTechWidget(w.tech));

      if (cards.length === 0) { hideTrending(); return; }

      setGridColumns(cards.length);
      trendingGrid.innerHTML = cards.map(c => c.html).join('');
      if (trendingRegion) {
        const region = data.countryName && data.countryName !== 'Global'
          ? data.countryName
          : 'Worldwide';
        trendingRegion.textContent = region;
      }

      /* Bind ask strings via dataset AFTER parsing HTML — the browser
       * will store the exact JS string without any attribute-parse
       * round-trip, so quotes and other tricky characters survive. */
      const cardEls = trendingGrid.querySelectorAll('.sm-widget');
      cardEls.forEach((el, i) => {
        const ask = cards[i] && cards[i].ask;
        if (!ask) return;
        el.dataset.ask = ask;

        const handler = (ev) => {
          if (ev.target.closest('[data-noask]')) return;
          ev.preventDefault();
          const q = el.dataset.ask;
          if (q) submitQuery(q);
        };
        el.addEventListener('click', handler);
        el.addEventListener('keydown', (ev) => {
          if (ev.key === 'Enter' || ev.key === ' ') {
            ev.preventDefault();
            const q = el.dataset.ask;
            if (q) submitQuery(q);
          }
        });
      });
    }

    /* Each widget renderer returns { html, ask }. The ask string is
     * bound to the card via el.dataset after innerHTML parses, never
     * interpolated into an HTML attribute, so quote-laden headlines
     * survive intact. Attribute-context interpolations use escAttr(). */

    function renderNewsWidget(n) {
      const ask = `Give me a deeper briefing on this story: "${n.title}". What are the key facts, context, and credible perspectives?`;
      const src = n.url
        ? `<a class="sm-widget-src" href="${escAttr(n.url)}" target="_blank" rel="noopener" data-noask="1">${esc(n.source || 'Source')} ${icons.externalLink}</a>`
        : `<span>${esc(n.source || '')}</span>`;
      const kicker = n.label && n.label.includes('·') ? n.label.split('·').slice(1).join('·').trim() : (n.label || 'Local');
      const html = `
        <div class="sm-widget news" role="button" tabindex="0" title="${escAttr(n.title)}">
          <div class="sm-widget-kicker">${esc(kicker)}</div>
          <div class="sm-widget-title">${esc(n.title)}</div>
          <div class="sm-widget-body">${esc(n.summary || '')}</div>
          <div class="sm-widget-meta">${src}</div>
        </div>`;
      return { html, ask };
    }

    function renderWorldNewsWidget(n) {
      const ask = `What's the full story behind the top global headline right now: "${n.title}"? Give me the key facts, international context, and the range of credible perspectives.`;
      const src = n.url
        ? `<a class="sm-widget-src" href="${escAttr(n.url)}" target="_blank" rel="noopener" data-noask="1">${esc(n.source || 'Source')} ${icons.externalLink}</a>`
        : `<span>${esc(n.source || '')}</span>`;
      const html = `
        <div class="sm-widget world" role="button" tabindex="0" title="${escAttr(n.title)}">
          <div class="sm-widget-kicker">Worldwide</div>
          <div class="sm-widget-title">${esc(n.title)}</div>
          <div class="sm-widget-body">${esc(n.summary || '')}</div>
          <div class="sm-widget-meta">${src}</div>
        </div>`;
      return { html, ask };
    }

    function renderMarketWidget(m) {
      const sign = m.changePercent >= 0 ? '+' : '';
      const ask = `Why is ${m.name} (${m.symbol}) the biggest mover in ${m.index} today, ${sign}${m.changePercent}%? Give me context and sources.`;
      const html = `
        <div class="sm-widget market" role="button" tabindex="0">
          <div class="sm-widget-kicker">${esc(m.index || 'Markets')}</div>
          <div class="sm-widget-title sm-ticker">
            <span class="sm-ticker-symbol">${esc(m.symbol)}</span>
            <span class="sm-ticker-pct ${m.direction === 'up' ? 'up' : 'down'}">${sign}${esc(String(m.changePercent))}%</span>
          </div>
          <div class="sm-widget-body">${esc(m.name || '')}${m.reason ? ' — ' + esc(m.reason) : ''}</div>
        </div>`;
      return { html, ask };
    }

    function renderTechWidget(t) {
      const ask = `Summarise and react to this Hacker News story: "${t.title}". Why is it resonating with developers? Any notable context?`;
      const link = t.url || t.hnUrl;
      const src = link
        ? `<a class="sm-widget-src" href="${escAttr(link)}" target="_blank" rel="noopener" data-noask="1">${esc(t.source || 'news.ycombinator.com')} ${icons.externalLink}</a>`
        : `<span>${esc(t.source || '')}</span>`;
      const html = `
        <div class="sm-widget tech" role="button" tabindex="0" title="${escAttr(t.title)}">
          <div class="sm-widget-kicker">Hacker News</div>
          <div class="sm-widget-title">${esc(t.title)}</div>
          <div class="sm-widget-body">${src}</div>
          <div class="sm-widget-meta">
            <span>${esc(String(t.score || 0))} points</span>
            <span class="sep">·</span>
            <span>${esc(String(t.comments || 0))} comments</span>
          </div>
        </div>`;
      return { html, ask };
    }

    function renderStarters() {
      researchGridEl.innerHTML = starters.map(s =>
        `<button class="sm-research-card" type="button">
          <h3>${esc(s.query)}</h3>
        </button>`
      ).join('');
      Array.from(researchGridEl.children).forEach((el, i) => {
        el.dataset.q = starters[i].query;
      });
    }

    function bindEvents() {
      sendBtn.addEventListener('click', handleSend);
      queryInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
          e.preventDefault();
          handleSend();
        }
      });
      queryInput.addEventListener('input', function() {
        updateSendButton();
        autoResizeTextarea();
      });

      researchGridEl.addEventListener('click', function(e) {
        const card = e.target.closest('.sm-research-card');
        if (card && card.dataset.q) submitQuery(card.dataset.q);
      });
      chatArea.addEventListener('click', function(e) {
        const btn = e.target.closest('.sm-related-btn');
        if (btn) submitQuery(btn.dataset.query);
        const cite = e.target.closest('.sm-cite');
        if (cite) {
          e.preventDefault();
          const url = cite.dataset.url;
          if (url) window.open(url, '_blank');
        }
      });
      newChatBtn.addEventListener('click', resetChat);
    }

    function updateSendButton() {
      const hasText = queryInput.value.trim().length > 0;
      sendBtn.classList.toggle('active', hasText && !isLoading);
    }

    function autoResizeTextarea() {
      queryInput.style.height = 'auto';
      queryInput.style.height = Math.min(queryInput.scrollHeight, 140) + 'px';
    }

    function submitQuery(query) {
      queryInput.value = query;
      updateSendButton();
      handleSend();
    }

    function handleSend() {
      const query = queryInput.value.trim();
      if (!query || query.length < 2 || isLoading) return;

      const isFirst = !landing.classList.contains('hidden');
      if (isFirst) {
        landing.classList.add('hidden');
        chatArea.classList.add('active');
        hideTrending();
        if (inputMeta) inputMeta.classList.add('faded');
        appendWelcomeMessage();
      }

      logQuery(query);
      appendUserMessage(query);
      conversationHistory.push({role: 'user', content: query});
      queryInput.value = '';
      queryInput.style.height = 'auto';
      updateSendButton();
      showLoading();
      fetchResponse(query);
    }

    function appendWelcomeMessage() {
      /* Intentionally no-op. The sober design replaces the chatty
       * welcome paragraph with a quieter "thinking" indicator that
       * already follows the user's first message — see showLoading(). */
    }

    function logQuery(query) {
      try {
        console.log('[Summaverick]', new Date().toISOString(), query);
        if (navigator.sendBeacon) {
          navigator.sendBeacon(ENDPOINT, JSON.stringify({
            query: '__analytics__',
            context: [{role:'log', content: query}]
          }));
        }
      } catch(e) {}
    }

    function appendUserMessage(text) {
      const div = document.createElement('div');
      div.className = 'sm-msg sm-msg-user';
      const bubble = document.createElement('div');
      bubble.className = 'sm-msg-content';
      bubble.textContent = text;
      div.appendChild(bubble);
      chatArea.appendChild(div);
      scrollToBottom();
    }

    function showLoading() {
      isLoading = true;
      updateSendButton();
      const div = document.createElement('div');
      div.className = 'sm-msg sm-msg-ai';
      div.id = 'loadingMsg';
      div.innerHTML = `
        <div class="sm-msg-body">
          <div class="sm-thinking" aria-label="Thinking">
            <span class="sm-thinking-mark" aria-hidden="true"></span>
          </div>
        </div>`;
      chatArea.appendChild(div);
      scrollToBottom();
    }

    function removeLoading() {
      const el = document.getElementById('loadingMsg');
      if (el) el.remove();
      isLoading = false;
      updateSendButton();
    }

    function buildRequestBody(query) {
      const prior = conversationHistory.slice(-(MAX_CONTEXT_MESSAGES));
      const context = prior.length > 1 ? prior.slice(0, -1) : [];
      return {query, context};
    }

    async function fetchResponse(query) {
      try {
        const body = buildRequestBody(query);
        const res = await fetch(ENDPOINT, {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify(body)
        });

        if (!res.ok) throw new Error('API error: ' + res.status);
        const data = await res.json();

        removeLoading();

        if (data.success && data.result) {
          const answer = data.result.answer || 'No answer available.';
          conversationHistory.push({role: 'assistant', content: answer});
          appendAIMessage(data.result);
        } else {
          appendErrorMessage('No results found. Try rephrasing your question.');
        }
      } catch (err) {
        removeLoading();
        appendErrorMessage('Something went wrong. Please try again.');
      }
    }

    function appendAIMessage(result) {
      const answer = result.answer || '';
      const sources = result.sources || [];
      const related = result.relatedQuestions || [];

      let formattedAnswer = formatMarkdown(answer);
      sources.forEach(function(s) {
        const citeRe = new RegExp('\\[' + s.index + '\\]', 'g');
        formattedAnswer = formattedAnswer.replace(citeRe,
          `<a class="sm-cite" href="#" data-url="${esc(s.url)}" title="${esc(s.title || s.source)}">${s.index}</a>`
        );
      });

      let sourcesHtml = '';
      if (sources.length > 0) {
        sourcesHtml = `<div class="sm-sources">
          <div class="sm-sources-label">Sources</div>
          ${sources.map(s => `
            <a class="sm-source-card" href="${esc(s.url)}" target="_blank" rel="noopener">
              <div class="sm-source-num">${s.index}</div>
              <div class="sm-source-info">
                <div class="sm-source-title">${esc(s.title || s.source)}</div>
                <div class="sm-source-domain">${esc(s.source)}</div>
              </div>
              <div class="sm-source-arrow">${icons.externalLink}</div>
            </a>
          `).join('')}
        </div>`;
      }

      let relatedHtml = '';
      if (related.length > 0) {
        relatedHtml = `<div class="sm-related">
          ${related.map(q => `<button class="sm-related-btn" data-query="${esc(q)}">${esc(q)}</button>`).join('')}
        </div>`;
      }

      const div = document.createElement('div');
      div.className = 'sm-msg sm-msg-ai';
      div.innerHTML = `
        <div class="sm-msg-body">
          <div class="sm-msg-content">${formattedAnswer}</div>
          ${sourcesHtml}
          ${relatedHtml}
        </div>`;
      chatArea.appendChild(div);
      scrollToBottom();
    }

    function appendErrorMessage(text) {
      const div = document.createElement('div');
      div.className = 'sm-msg sm-msg-ai';
      div.innerHTML = `
        <div class="sm-msg-body">
          <div class="sm-msg-content" style="color:var(--text-3)">${esc(text)}</div>
        </div>`;
      chatArea.appendChild(div);
      scrollToBottom();
    }

    function resetChat() {
      conversationHistory = [];
      chatArea.innerHTML = '';
      chatArea.classList.remove('active');
      landing.classList.remove('hidden');
      if (inputMeta) inputMeta.classList.remove('faded');
      queryInput.value = '';
      queryInput.style.height = 'auto';
      updateSendButton();
      loadTrending();
    }

    function scrollToBottom() {
      requestAnimationFrame(() => {
        window.scrollTo({top: document.body.scrollHeight, behavior: 'smooth'});
      });
    }

    function formatMarkdown(md) {
      if (!md) return '';
      let html = md;
      html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (m, lang, code) => '<pre>' + esc(code.trim()) + '</pre>');
      html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
      html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
      html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
      html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/^- (.+)$/gm, '<li>$1</li>');
      html = html.replace(/(<li>[\s\S]*?<\/li>)/g, function(m) {
        if (m.indexOf('<ul>') === -1) return '<ul>' + m + '</ul>';
        return m;
      });
      html = html.replace(/<\/ul>\s*<ul>/g, '');
      html = html.replace(/^\d+\. (.+)$/gm, '<li>$1</li>');
      html = html.replace(/\n\n/g, '</p><p>');
      html = html.replace(/([^>])\n([^<])/g, '$1<br>$2');
      if (!/^<(h[23]|ul|ol|pre|div|p)/.test(html.trim())) {
        html = '<p>' + html + '</p>';
      }
      return html;
    }

    function esc(str) {
      if (!str) return '';
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    /* esc() is safe for text nodes (it escapes < > & via the
     * textContent→innerHTML round-trip) but DOES NOT escape the
     * double-quote character. Interpolating esc(x) inside an HTML
     * attribute like foo="${esc(x)}" silently truncates whenever x
     * contains a " — which caused prefilled widget queries to lose
     * their story context when a headline quoted something.
     * Use this helper for any attribute-bound interpolation. */
    function escAttr(str) {
      if (str == null) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;');
    }

    init();
  })();
  </script>
