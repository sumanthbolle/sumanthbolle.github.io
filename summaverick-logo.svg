<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 420" role="img" aria-label="Summaverick">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f3f7"/>
      <stop offset="0.5" stop-color="#9aa0ae"/>
      <stop offset="1" stop-color="#e8ecf5"/>
    </linearGradient>
    <linearGradient id="ribA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3b30"/>
      <stop offset="0.55" stop-color="#ff2d92"/>
      <stop offset="1" stop-color="#bf5af2"/>
    </linearGradient>
    <linearGradient id="ribB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5e5ce6"/>
      <stop offset="0.5" stop-color="#bf5af2"/>
      <stop offset="1" stop-color="#ff2d92"/>
    </linearGradient>
    <linearGradient id="ribC" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#64d2ff"/>
      <stop offset="0.55" stop-color="#32ded4"/>
      <stop offset="1" stop-color="#0a84ff"/>
    </linearGradient>
    <linearGradient id="ribD" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#ff2d92"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glass" cx="0.35" cy="0.3" r="1">
      <stop offset="0" stop-color="#181b22"/>
      <stop offset="1" stop-color="#0a0c10"/>
    </radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="15"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
    <clipPath id="arrowClip">
      <path d="M70 60 L1250 60 L1250 22 L1580 210 L1250 398 L1250 360 L70 360 Q34 360 34 324 L34 96 Q34 60 70 60 Z"/>
    </clipPath>
  </defs>

  <!-- glass arrow body -->
  <path d="M70 60 L1250 60 L1250 22 L1580 210 L1250 398 L1250 360 L70 360 Q34 360 34 324 L34 96 Q34 60 70 60 Z"
        fill="url(#glass)" fill-opacity="0.96" stroke="url(#chrome)" stroke-width="5"
        stroke-linejoin="round" stroke-opacity="0.85"/>

  <!-- light ribbons flowing through and around the arrow -->
  <g stroke-linecap="round" fill="none">
    <path d="M18 122 C300 66 700 58 1000 96 C1170 118 1250 62 1340 108" stroke="url(#ribA)" stroke-width="26" opacity="0.55" filter="url(#glow)"/>
    <path d="M18 122 C300 66 700 58 1000 96 C1170 118 1250 62 1340 108" stroke="url(#ribA)" stroke-width="7" opacity="0.9" filter="url(#soft)"/>

    <path d="M10 304 C350 352 720 332 1040 300 C1210 284 1290 344 1390 296" stroke="url(#ribB)" stroke-width="22" opacity="0.45" filter="url(#glow)"/>
    <path d="M10 304 C350 352 720 332 1040 300 C1210 284 1290 344 1390 296" stroke="url(#ribB)" stroke-width="6" opacity="0.85" filter="url(#soft)"/>

    <path d="M1215 55 C1420 85 1565 165 1545 235 C1522 322 1350 385 1235 352" stroke="url(#ribC)" stroke-width="22" opacity="0.5" filter="url(#glow)"/>
    <path d="M1215 55 C1420 85 1565 165 1545 235 C1522 322 1350 385 1235 352" stroke="url(#ribC)" stroke-width="6" opacity="0.9" filter="url(#soft)"/>

    <path d="M1290 385 C1445 352 1560 258 1495 172" stroke="url(#ribD)" stroke-width="16" opacity="0.5" filter="url(#glow)"/>
    <path d="M1290 385 C1445 352 1560 258 1495 172" stroke="url(#ribD)" stroke-width="5" opacity="0.85" filter="url(#soft)"/>
  </g>

  <!-- inner light wash so the ribbons read through the glass -->
  <g clip-path="url(#arrowClip)" stroke-linecap="round" fill="none" opacity="0.5">
    <path d="M18 122 C300 66 700 58 1000 96 C1170 118 1250 62 1340 108" stroke="url(#ribA)" stroke-width="34" filter="url(#glow)"/>
    <path d="M10 304 C350 352 720 332 1040 300 C1210 284 1290 344 1390 296" stroke="url(#ribB)" stroke-width="30" filter="url(#glow)"/>
    <path d="M1215 55 C1420 85 1565 165 1545 235 C1522 322 1350 385 1235 352" stroke="url(#ribC)" stroke-width="30" filter="url(#glow)"/>
  </g>

  <!-- wordmark -->
  <text x="640" y="258" text-anchor="middle"
        font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="142" font-weight="600" letter-spacing="-3" fill="#ffffff">Summaverick</text>

  <!-- sparkle -->
  <path d="M1388 46 l5 15 15 5 -15 5 -5 15 -5 -15 -15 -5 15 -5 z" fill="#ffffff" opacity="0.9"/>
</svg>
